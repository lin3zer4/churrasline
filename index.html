<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7d7">
<title>churrasline</title>
<meta name="description" content="Churrasco de aniversário: dia, hora, local, valor, convidados e bebidas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Anton&family=Space+Mono:wght@400;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root { --paper:#efe7d7; --ink:#161616; --blue:#33579a; --gray:#a9bbdd; --mid:#5d76a6; --soft:#e2e4e8;
    --font:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; overflow-x: clip; }
  body { margin: 0; font-family: var(--font); color: var(--ink); line-height: 1.4; background-color: var(--paper);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .2 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; } }

  /* ===== HERO ===== */
  .hero { display: flex; justify-content: center; overflow-x: clip; }
  .stage { position: relative; width: min(100%, 520px); container-type: inline-size; height: 142cqw; overflow: hidden; }
  .huge { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-family: "Anton", "Impact", sans-serif; color: var(--blue); line-height: .86; white-space: nowrap; text-transform: uppercase; }
  .name { position: absolute; z-index: 1; top: 6cqw; left: 5cqw; right: 5cqw; margin: 0; font-family: "Anton", "Impact", "Arial Narrow", sans-serif; font-weight: 400; color: var(--blue); font-size: 30cqw; line-height: .95; text-transform: uppercase; white-space: nowrap; }
  .name span { display: block; }
  .name .l2 { display: flex; justify-content: flex-start; gap: 3cqw; align-items: flex-end; }
  .chalkpic { display: block; flex: none; width: 24cqw; height: auto; margin-top: 1cqw; transform: rotate(3deg); }
  .huge svg, .script svg { display: block; overflow: visible; }
  .huge text { font-family: "Anton", "Impact", "Arial Narrow", sans-serif; fill: var(--blue); }
  .huge text.ink { fill: var(--ink); }
  #hTop { top: 0; z-index: 0; } #hBot { bottom: -9cqw; z-index: 0; }
  .script { position: absolute; left: 0; right: 0; top: 14cqw; z-index: 3; transform: rotate(-7deg); pointer-events: none; }
  .script text { font-family: "Mrs Saint Delafield", "Snell Roundhand", cursive; fill: var(--paper); stroke: rgba(51,87,154,.55); stroke-width: .25; }
  .card { position: absolute; z-index: 2; left: 7cqw; right: 7cqw; top: 68cqw; background: #f5efe2; border: .5cqw solid var(--ink); padding: 3.5cqw 4cqw 4cqw; box-shadow: 1.4cqw 1.4cqw 0 var(--blue); transform: rotate(-1deg); font-family: "Space Mono", ui-monospace, monospace; }
  .row { padding: 0 0 2.4cqw; margin-bottom: 2.4cqw; border-bottom: .3cqw solid var(--ink); }
  .row:last-of-type { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .chip { display: inline-block; background: var(--blue); color: var(--paper); font-weight: 700; font-size: 3.2cqw; letter-spacing: .08em; text-transform: uppercase; padding: 1cqw 2.6cqw; margin-bottom: 1.4cqw; }
  .val { font-weight: 700; font-size: 6.2cqw; line-height: 1.1; text-transform: uppercase; letter-spacing: -.02em; }
  .val small { display: block; font-weight: 400; font-size: 3.6cqw; margin-top: .8cqw; letter-spacing: 0; }
  .polaroid { position: absolute; right: -2cqw; top: -17cqw; width: 33cqw; background: var(--paper); border: .5cqw solid var(--ink); padding: 1.6cqw 1.6cqw 5cqw; transform: rotate(5deg); box-shadow: 1cqw 1cqw 0 rgba(22,22,22,.25); }
  .polaroid .ph { background: var(--blue); aspect-ratio: 1; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .polaroid img { width: 92%; height: auto; display: block; margin-bottom: -4%; }
  .polaroid span { position: absolute; left: 0; right: 0; bottom: 1.2cqw; text-align: center; font-family: "Mrs Saint Delafield", cursive; font-size: 6cqw; line-height: 1; color: var(--ink); }
  .down { position: absolute; left: 50%; bottom: 3cqw; transform: translateX(-50%); color: var(--blue); background: var(--paper); text-decoration: none; font-weight: 600; font-size: 4.2cqw;
    border: .5cqw solid var(--ink); border-radius: 99px; padding: 1.6cqw 5cqw; white-space: nowrap; animation: nudge 1.6s ease-in-out infinite; z-index: 3; }
  @keyframes nudge { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,1.4cqw); } }

  /* ===== DETALHES ===== */
  .details { max-width: 480px; margin: 0 auto; padding: 8px 18px 8px; container-type: inline-size; }
  .bora { font-family: "Anton", sans-serif; color: var(--blue); font-size: 17cqw; line-height: .95; text-align: center; margin: 0 0 14px; letter-spacing: -.3cqw; }
  .info { background: #f5efe2; border: 2px solid var(--ink); border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 5px 5px 0 var(--gray); }
  .info .k { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--mid); }
  .info .v { font-size: 1.35rem; font-weight: 500; }
  .info .v small { display: block; font-size: .88rem; font-weight: 300; opacity: .8; }
  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .price { border: 2px solid var(--ink); border-radius: 6px; padding: 12px 8px; text-align: center; background: var(--soft); }
  .price.vg { background: #f7f5f0; }
  .price b { display: block; font-size: 1.6rem; font-weight: 600; line-height: 1.1; }
  .price span { font-size: .82rem; font-weight: 400; opacity: .8; }
  .fine { font-size: .84rem; opacity: .75; margin: 10px 0 0; font-weight: 300; }
  .pix { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; background: #fff; border: 2px dashed var(--ink); border-radius: 6px; padding: 10px 12px; margin: 12px 0 8px; font-size: .9rem; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; font: inherit; font-weight: 600; font-size: 1.05rem; letter-spacing: .01em; text-align: center; text-decoration: none; cursor: pointer;
    background: var(--blue); color: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 16px; box-shadow: 5px 5px 0 var(--gray); }
  .btn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--gray); }
  .btn.alt { background: #f5efe2; color: var(--blue); border-color: var(--blue); }
  .btn.small { font-size: .95rem; padding: 11px 14px; margin-top: 10px; }
  .btn[aria-disabled="true"] { background: var(--gray); color: #555; border-color: var(--mid); pointer-events: none; box-shadow: none; }
  .fl { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 12px; }
  .fl input, .br input { display: block; width: 100%; font: inherit; font-size: 1rem; padding: 11px 12px; margin-top: 6px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); }
  .br { display: grid; grid-template-columns: 1fr 82px; gap: 8px; margin-bottom: 8px; }
  .br input { margin: 0 !important; }
  #bAdd { margin: 4px 0 8px; }
  .chk { display: flex; align-items: center; gap: 10px; font-weight: 500; padding: 10px 2px; cursor: pointer; }
  .chk input { width: 22px; height: 22px; accent-color: var(--ink); flex: none; }
  #bSend { margin-top: 14px; } #bCopy { margin-top: 12px; }
  .dup { display: none; }
  .actions { max-width: 480px; margin: 0 auto; padding: 10px 18px 0; display: grid; gap: 16px; }
  .actions .btn { padding: 19px 16px; font-size: 1.12rem; }
  footer { text-align: center; color: var(--mid); font-weight: 300; padding: 34px 16px calc(34px + env(safe-area-inset-bottom)); }

  /* ===== DIALOGS ===== */
  dialog { border: 0; padding: 0; background: var(--paper); color: var(--ink); width: 100%; max-width: 520px; max-height: 88vh; max-height: 88dvh; margin: auto auto 0; border-radius: 14px 14px 0 0; font-family: var(--font); }
  dialog::backdrop { background: rgba(20,20,20,.55); }
  .sheet-head { position: sticky; top: 0; z-index: 1; background: var(--blue); color: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 14px 20px; }
  .sheet-head h3 { margin: 0; font-size: 1.2rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .x { font: inherit; font-weight: 600; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); cursor: pointer; }
  .sheet-body { padding: 16px 18px calc(24px + env(safe-area-inset-bottom)); }
  .counter { display: inline-block; background: var(--blue); color: var(--paper); font-weight: 600; border-radius: 99px; padding: 3px 12px; font-size: .85rem; margin-bottom: 12px; }
  .guests { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .guests li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; background: #f7f5f0; border: 1px solid var(--gray); min-width: 0; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #fff; flex: none; background: var(--blue); }
  .gname { font-weight: 500; min-width: 0; overflow-wrap: anywhere; line-height: 1.15; }
  .gname small { display: block; font-size: .7rem; color: var(--mid); font-weight: 400; }
  .cat { margin-top: 16px; } .cat:first-child { margin-top: 0; }
  .cat h4 { margin: 0 0 4px; display: flex; justify-content: space-between; gap: 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; }
  .cat h4 span:last-child { opacity: .7; font-weight: 500; }
  .cat ul { list-style: none; margin: 0; padding: 0; }
  .cat li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px dashed var(--gray); }
  .cat li:last-child { border-bottom: 0; }
  .cat li small { opacity: .65; margin-left: 6px; }
  .cat li b { white-space: nowrap; font-weight: 600; }
  .total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 600; padding-top: 12px; margin-top: 14px; border-top: 3px solid var(--ink); }
</style>
</head>

/* ========= CÁLCULO ========= */
function el(id) { return document.getElementById(id); }
function mk(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function brl(n) { return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function soma(arr) { return arr.reduce(function (a, b) { return a + b.valor; }, 0); }

var totalGeral = soma(ITENS);
var totalCarne = soma(ITENS.filter(function (i) { return i.tipo === "carne"; }));
var totalResto = totalGeral - totalCarne;
var pagantes = PESSOAS.filter(function (p) { return p.paga; });
var pagantesCarne = pagantes.filter(function (p) { return p.carne; });
var valorSemCarne = totalResto / pagantes.length;
var valorComCarne = valorSemCarne + totalCarne / pagantesCarne.length;
if (CONFIG.valorComCarne) valorComCarne = CONFIG.valorComCarne;   // valores arredondados
if (CONFIG.valorSemCarne) valorSemCarne = CONFIG.valorSemCarne;

/* ========= DETALHES ========= */
(function detalhes() {
  el("iDia").textContent = CONFIG.diaTexto;
  el("cDia").textContent = CONFIG.diaTexto;
  el("cHora").textContent = CONFIG.horario || "A confirmar";
  var cl = el("cLocal"); cl.textContent = CONFIG.local || "A confirmar";
  if (CONFIG.endereco) cl.appendChild(mk("small", "", CONFIG.endereco));
  el("iHora").textContent = CONFIG.horario || "A confirmar";
  var l = el("iLocal");
  l.textContent = CONFIG.local || "A confirmar";
  if (CONFIG.endereco) { l.appendChild(mk("small", "", CONFIG.endereco)); }
  if (CONFIG.mapaUrl) { var m = el("mapBtn"); m.href = CONFIG.mapaUrl; m.textContent = "Abrir no mapa"; m.hidden = false; }

  el("iValorSub").textContent = "Dividido entre " + pagantes.length + " pessoas";
  el("priceMeat").textContent = brl(valorComCarne);
  el("priceVeg").textContent = brl(valorSemCarne);

  if (!CONFIG.pixChave) {
    el("pixBox").hidden = true;
  } else {
    el("pixKey").textContent = "Pix: " + CONFIG.pixChave;
    el("pixName").textContent = CONFIG.pixNome ? "Favorecido: " + CONFIG.pixNome : "";
    el("pixName").hidden = !CONFIG.pixNome;
    el("copyBtn").addEventListener("click", function () {
      var btn = this;
      function ok() { btn.textContent = "Copiado!"; setTimeout(function () { btn.textContent = "Copiar chave Pix"; }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(CONFIG.pixChave).then(ok, function () { window.prompt("Copie a chave:", CONFIG.pixChave); });
      } else { window.prompt("Copie a chave:", CONFIG.pixChave); }
    });
  }

})();

/* ========= CONVIDADOS ========= */
(function convidados() {
  function cor(nome) { var h = 0; for (var i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) % 360; return "hsl(" + h + ",60%,45%)"; }
  el("guestCount").textContent = PESSOAS.length + " confirmados";
  var ul = el("guests");
  PESSOAS.forEach(function (p) {
    var li = mk("li");
    var av = mk("span", "av", p.nome.charAt(0).toUpperCase());
    av.style.background = cor(p.nome);
    var nm = mk("span", "gname", p.nome);
    if (!p.carne) nm.appendChild(mk("small", "", "sem carne"));
    li.appendChild(av); li.appendChild(nm); ul.appendChild(li);
  });
})();

/* ========= ITENS ========= */
(function itens() {
  var box = el("shopping");
  CATEGORIAS.forEach(function (c) {
    var lista = ITENS.filter(function (i) { return i.cat === c.id; });
    if (!lista.length) return;
    var sec = mk("div", "cat");
    var h = mk("h4"); h.appendChild(mk("span", "", c.titulo)); h.appendChild(mk("span", "", brl(soma(lista))));
    sec.appendChild(h);
    var ul = mk("ul");
    lista.forEach(function (i) {
      var li = mk("li");
      var a = mk("span", "", i.nome); a.appendChild(mk("small", "", i.qtd));
      li.appendChild(a); li.appendChild(mk("b", "", brl(i.valor)));
      ul.appendChild(li);
    });
    sec.appendChild(ul); box.appendChild(sec);
  });
  el("shopTotal").textContent = brl(totalGeral);
})();

/* ========= TÍTULO: ajusta ao tamanho da tela ========= */
(function fit() {
  var h = el("hTop");
  function go() {
    h.style.fontSize = "";
    var size = parseFloat(getComputedStyle(h).fontSize), w = h.clientWidth;
    var l1 = el("nm1"), r = document.createRange(); r.selectNodeContents(l1);
    var tw = r.getBoundingClientRect().width;
    if (tw > w) h.style.fontSize = (size * w / tw * .98) + "px";
  }
  go();
  window.addEventListener("resize", go);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
})();

/* ========= DIALOGS ========= */
Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function (b) {
  b.addEventListener("click", function () {
    var d = el(b.getAttribute("data-open"));
    if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  });
});
Array.prototype.forEach.call(document.querySelectorAll("dialog"), function (d) {
  d.addEventListener("click", function (e) { if (e.target === d) d.close(); });
  var x = d.querySelector("[data-close]");
  x.addEventListener("click", function () { if (d.close) d.close(); else d.removeAttribute("open"); });
});
</script>
